name: Auto Update Rules

on:
  schedule:
    # 每天 UTC 18:00（北京时间凌晨 2 点）执行一次
    - cron: '0 18 * * *'
  workflow_dispatch: # 允许手动触发

# 显式赋予 Token 写入权限，否则 git push 会以 exit code 128 失败
permissions:
  contents: write

# 同一时间只跑一个更新任务，避免两个 push 互相顶掉
concurrency:
  group: update-rules
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: true

      # ------------------------------------------------------------------
      # 上游溯源：解析 meta 分支的 commit sha 并 pin 住。
      #
      # 上游不提供任何 checksum 文件，因此"下载到的内容是否被篡改"
      # 无法靠上游校验——唯一可靠的办法是把 commit sha 记进 meta.json，
      # 让本地产物的每一行都能追溯到具体的上游快照。
      # ------------------------------------------------------------------
      - name: Resolve upstream commit
        id: upstream
        run: |
          set -euo pipefail
          sha="$(curl -fsSL --retry 5 --retry-delay 3 --retry-all-errors \
                 https://api.github.com/repos/MetaCubeX/meta-rules-dat/commits/meta \
                 | jq -r '.sha')"
          if [[ -z "$sha" || "$sha" == "null" ]]; then
            echo "::error::无法解析上游 meta 分支的 commit sha，终止（保留旧规则集）"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "上游 commit: $sha"

      # ------------------------------------------------------------------
      # 拉取上游分类文件。
      #
      # 路径实测（不是推测）：
      #   geo-lite/geosite/{cn,apple,applemusic,bilibili,
      #                    proxy,google,youtube,github,openai,private}.list
      #   geo/geosite/category-ads-all.list   ← ads 分类只在 geo/ 下，
      #                                            geo-lite/ 里没有
      #
      # 拉取失败即整体失败：半套规则集比旧规则集更糟。
      # ------------------------------------------------------------------
      - name: Fetch upstream rule files
        env:
          UPSTREAM_SHA: ${{ steps.upstream.outputs.sha }}
        run: |
          set -euo pipefail
          mkdir -p .cache/rules
          base="https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/${UPSTREAM_SHA}"

          fetch() {
            local path="$1" out="$2"
            if ! curl -fsSL --retry 5 --retry-delay 3 --retry-all-errors \
                    -o "$out" "${base}/${path}"; then
              echo "::error::拉取失败: ${path}"
              exit 1
            fi
            if [[ ! -s "$out" ]]; then
              echo "::error::拉取到空文件: ${path}"
              exit 1
            fi
          }

          for c in cn apple applemusic bilibili \
                   proxy google youtube github openai private; do
            fetch "geo-lite/geosite/${c}.list" ".cache/rules/${c}.list"
          done
          fetch "geo/geosite/category-ads-all.list" ".cache/rules/category-ads-all.list"

          echo "已拉取 $(ls -1 .cache/rules | wc -l) 个上游分类文件"

      # ------------------------------------------------------------------
      # 组装 + 校验。
      #
      # 逻辑放在 scripts/compose_rules.py 而不是内联 heredoc：
      # 有分支与阈值的校验逻辑必须能在 CI 之外复现验证（改坏了不能
      # 只靠等 CI 跑一次才知道）。脚本以非零码退出 = 校验不过 =
      # rules/ 保持旧内容不变。
      # ------------------------------------------------------------------
      - name: Compose and validate rule layers
        env:
          UPSTREAM_SHA: ${{ steps.upstream.outputs.sha }}
        run: |
          set -euo pipefail
          RULE_CACHE=.cache/rules RULE_OUT=.cache/out \
            python3 scripts/compose_rules.py

      # ------------------------------------------------------------------
      # 落到 rules/。只有上一步全部通过才会走到这里，
      # 因此 rules/ 要么是完整的新版本，要么是完整的旧版本——
      # 不存在"更新到一半"的中间态。
      # ------------------------------------------------------------------
      - name: Publish built rule files
        run: |
          set -euo pipefail
          for f in direct.txt proxy.txt reject.txt fake_ip_filter.txt \
                   meta.json manifest.json; do
            mv ".cache/out/$f" "rules/$f"
          done
          rm -rf .cache
          echo "已发布:"; ls -l rules/

      - name: Check for changes
        id: git-check
        run: |
          set -euo pipefail
          git add -A rules/
          if git diff --cached --quiet; then
            echo "modified=false" >> "$GITHUB_OUTPUT"
            echo "规则集无变化"
          else
            echo "modified=true" >> "$GITHUB_OUTPUT"
            git diff --cached --stat rules/
          fi

      - name: Commit and push if changed
        if: steps.git-check.outputs.modified == 'true'
        run: |
          set -euo pipefail
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git commit -m "chore(rules): 自动更新规则集 ($(date -u +'%Y-%m-%d'))"

          # push 可能因分支被并发推进而失败（尽管有 concurrency 保护），
          # 先 rebase 再推；连续失败 3 次才判定为真失败。
          for i in 1 2 3; do
            if git push origin HEAD:"${GITHUB_REF_NAME}"; then
              echo "推送成功"
              exit 0
            fi
            echo "::warning::第 ${i} 次推送失败，rebase 后重试"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            sleep $((i * 5))
          done
          echo "::error::连续 3 次推送失败"
          exit 1

      # ------------------------------------------------------------------
      # 汇报。always() 让它在失败时也跑——但**绝不能因此把 job 判失败**。
      # 上一版这里读旧版 meta.json 的 m['totals'] 抛 KeyError，把 job
      # 拉成 failed：主流程其实已经成功，失败的是汇报本身。
      # 现在对 schema 做兼容，且汇报失败只记警告。
      # ------------------------------------------------------------------
      - name: Summary
        if: always()
        run: |
          set -uo pipefail
          {
            echo "## 规则集更新"
            echo ""
            echo "| 层 | 条数 |"
            echo "|---|---|"
            python3 - <<'PY' || echo "（本次未产出规则集统计）"
          import json
          from pathlib import Path

          path = Path("rules/meta.json")
          if not path.exists():
              raise SystemExit(0)
          meta = json.loads(path.read_text(encoding="utf-8"))

          # schema v2 用 totals；v1 用 stats。两者都认，避免旧文件把汇报搞崩。
          totals = meta.get("totals") or meta.get("stats") or {}
          for layer, count in totals.items():
              print(f"| {layer} | {count} |")

          source = meta.get("source") or {}
          commit = source.get("commit")
          if commit:
              print()
              print(f"上游 commit: {commit}")
          PY
          } >> "$GITHUB_STEP_SUMMARY"
