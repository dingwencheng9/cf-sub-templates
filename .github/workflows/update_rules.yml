name: Auto Update Rules

on:
  schedule:
    # 每天 UTC 18:00（北京时间凌晨 2 点）执行一次
    - cron: '0 18 * * *'
  workflow_dispatch: # 允许手动触发

# 🔥 核心修复：显式赋予 Token 写入权限，解决 exit code 128
permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # 🔥 修复：升级到 v4 解决 Node 20 警告
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download latest rules
        run: |
          echo "拉取 Loyalsoldier 直连规则..."
          curl -sL https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/direct.txt -o rules/direct.txt
          
          echo "拉取 Loyalsoldier 代理规则..."
          curl -sL https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/proxy.txt -o rules/proxy.txt
          
          echo "拉取广告拦截规则..."
          curl -sL https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/reject.txt -o rules/reject.txt

      - name: Check for changes
        id: git-check
        run: |
          # 🔥 修复：使用 $GITHUB_OUTPUT 代替废弃的 ::set-output
          if git diff --exit-code rules/; then
            echo "modified=false" >> $GITHUB_OUTPUT
          else
            echo "modified=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push if changed
        if: steps.git-check.outputs.modified == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add rules/
          git commit -m "chore: 自动更新规则集 ($(date +'%Y-%m-%d'))"
          git push
